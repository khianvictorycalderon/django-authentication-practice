<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <p>You are logged in as {{ request.user.username }}.</p>

        <button type="submit">Log out</button>
    </form>
</body>
</html>
